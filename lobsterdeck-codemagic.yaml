workflows:
  ios-unsigned:
    name: iOS unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Archive (unsigned)
        script: |
          set -o pipefail
          cd ios
          mkdir -p build
          xcodebuild -project LobsterDeck.xcodeproj \
            -scheme LobsterDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LobsterDeck.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build/xcodebuild.log
      - name: Package unsigned IPA
        script: |
          cd ios
          mkdir -p build/Payload
          cp -R build/LobsterDeck.xcarchive/Products/Applications/LobsterDeck.app build/Payload/
          cd build
          zip -qry LobsterDeck-unsigned.ipa Payload
          ls -lh LobsterDeck-unsigned.ipa
    artifacts:
      - ios/build/LobsterDeck-unsigned.ipa
      - ios/build/xcodebuild.log
