name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-26-arm64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Compile (diagnostic, 8m cap)
        timeout-minutes: 8
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project LobsterDeck.xcodeproj -scheme LobsterDeck -configuration Release -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build/compile.log

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project LobsterDeck.xcodeproj -scheme LobsterDeck -configuration Release -destination 'generic/platform=iOS' -archivePath build/LobsterDeck.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build/xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/LobsterDeck.xcarchive/Products/Applications/LobsterDeck.app build/Payload/
          cd build
          zip -qry LobsterDeck-unsigned.ipa Payload
          ls -lh LobsterDeck-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LobsterDeck-unsigned-ipa
          path: ios/build/LobsterDeck-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
